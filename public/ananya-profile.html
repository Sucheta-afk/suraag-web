  </div>
 </section>
 <section class="profile" id="profile" aria-label="Full profile">
  ${A.guru?`<div class="sec"><h2>Guru Parampara<small class="hi" lang="hi">गुरु परंपरा</small></h2><div><div class="gname">${A.guru.name}</div><p class="gmeta">${[A.guru.title,A.guru.gharana&&A.guru.gharana+" gharana",A.guru.place,A.guru.since&&"Learning together since "+A.guru.since].filter(Boolean).join(", ")}</p>${A.guru.note?`<p>${A.guru.note}</p>`:""}${has(A.parampara)?`<p class="h" style="margin-top:22px">Lineage</p><ol class="tl">${A.parampara.map(p=>`<li><b>${p.n}</b><span>${p.r}</span></li>`).join("")}</ol>`:""}</div></div>`:""}
  ${has(A.journey)?`<div class="sec"><h2>Musical journey<small>Safar</small></h2><ol class="tl">${A.journey.map(j=>`<li><b>${j.y}: ${j.t}</b><span>${j.d}</span></li>`).join("")}</ol></div>`:""}
  ${has(A.portfolio)?`<div class="sec"><h2>Performances and recordings<small>Peshkash</small></h2><div class="work">${A.portfolio.map(w=>`<a href="#"><b>${w.t}</b><span>${w.s}</span></a>`).join("")}</div></div>`:""}
  ${has(A.genres)?`<div class="sec"><h2>Genres</h2><ul class="chips">${chips(A.genres)}</ul></div>`:""}
  ${has(A.achievements)?`<div class="sec"><h2>Achievements</h2><div>${A.achievements.map(a=>`<p>${a}</p>`).join("")}</div></div>`:""}
  ${(A.availability||has(A.socialLinks))?`<div class="sec"><h2>Collaborate</h2><div>${A.availability?`<p>${A.availability}</p>`:""}<div class="share" style="margin-top:0">${(A.socialLinks||[]).map(s=>`<a class="btn" href="${s.u}" rel="noopener">${s.n}</a>`).join("")}</div></div></div>`:""}
 </section>`;
 /* QR */
 try{new QRCode($("#qr"),{text:url,width:96,height:96,colorDark:"#2a1a12",colorLight:"#ffffff"})}catch(e){$("#qr").textContent=""}
 /* share */
 const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800)};
 $("#wa").href="https://wa.me/?text="+encodeURIComponent(`${A.artistName}, ${A.primaryRole} on Suraag: ${url}`);
 $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(url);toast("Link copied")}catch(e){toast("Copy the address from your browser bar")}};
 if(navigator.share){const b=$("#sh");b.hidden=false;b.onclick=()=>navigator.share({title:`${A.artistName} | ${A.primaryRole} — Suraag`,text:A.artistStatement,url}).catch(()=>{})}
 $("#dl").onclick=()=>downloadCard(toast);
 /* player (simulated until a real audio file is connected) */
 if(A.featuredAudio){let on=false,t=0,iv;const f=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  $("#pb").onclick=()=>{on=!on;$("#pl").classList.toggle("playing",on);$("#pb").setAttribute("aria-label",on?"Pause recording":"Play featured recording");
   $("#pi").innerHTML=on?'<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>';
   clearInterval(iv);if(on)iv=setInterval(()=>{t=(t+1)%A.featuredAudio.len;$("#pt").textContent=f(t)+" / "+f(A.featuredAudio.len)},1000)}}
 /* subtle parallax on the portrait */
 const svg=$("#ph img");if(!matchMedia("(prefers-reduced-motion:reduce)").matches)addEventListener("scroll",()=>{svg.style.transform=`translateY(${Math.min(scrollY,500)*.06}px) scale(1.06)`},{passive:true});
}
/* static downloadable card (the same approach can generate the OG image server-side) */
function downloadCard(toast){
 const A=ARTIST,c=document.createElement("canvas");c.width=1080;c.height=1350;const x=c.getContext("2d");
 x.fillStyle="#f3ead9";x.fillRect(0,0,1080,1350);x.strokeStyle="#a8832f";x.lineWidth=2;x.strokeRect(40,40,1000,1270);x.strokeStyle="rgba(42,26,18,.25)";x.lineWidth=1;x.strokeRect(52,52,976,1246);
 const g=x.createLinearGradient(0,100,0,760);g.addColorStop(0,"#c98f55");g.addColorStop(1,"#3a2217");x.fillStyle=g;x.fillRect(100,100,880,650);
 const im=$("#ph img");if(im&&im.naturalWidth){const W=880,H=650,sr=im.naturalWidth/im.naturalHeight,dr=W/H;let sw=im.naturalWidth,sh=im.naturalHeight,sx=0,sy=0;if(sr>dr){sw=sh*dr;sx=(im.naturalWidth-sw)/2}else{sh=sw/dr;sy=(im.naturalHeight-sh)*.25}x.drawImage(im,sx,sy,sw,sh,100,100,W,H)}
 x.fillStyle="#2a1a12";x.font='600 38px Georgia,serif';x.fillText("SURAAG.IN",100,830);
 x.font='600 112px "Fraunces",Georgia,serif';x.fillText(A.artistName,100,960);
 x.fillStyle="#a9502f";x.font='italic 48px "Fraunces",Georgia,serif';x.fillText(A.primaryRole,100,1030);
 x.fillStyle="#6b5444";x.font='30px "DM Sans",sans-serif';x.fillText([A.location,A.genres&&A.genres.slice(0,3).join(", ")].filter(Boolean).join("  |  "),100,1090);
 x.fillText("Artist no. "+A.artistNumber,100,1250);
 const q=$("#qr canvas");if(q){x.fillStyle="#fff";x.fillRect(820,1060,160,160);x.drawImage(q,830,1070,140,140)}
 c.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=A.slug+"-suraag-card.png";a.click();toast("Card downloaded")});
}
/* floating notes: varied size, speed and sway; negative delays so the air is already full on load */
(function(){const g=["♪","♫","♩","♬","𝄞","♪","♫"],cs=["var(--gold)","var(--terra)","var(--caramel)"],n=innerWidth<700?14:26,box=$("#notes");
 for(let k=0;k<n;k++){const s=document.createElement("span"),d=16+Math.random()*18;
  s.textContent=g[k%g.length];
  s.style.cssText=`--x:${Math.random()*96}%;--s:${20+Math.random()*44}px;--dur:${d}s;--delay:-${Math.random()*d}s;--sw:${Math.random()*60+20}px;--o:${(.16+Math.random()*.22).toFixed(2)};--c:${cs[k%3]}`;
  box.appendChild(s)}})();
/* tap anywhere: a small burst of notes starts from that exact point */
if(!matchMedia("(prefers-reduced-motion:reduce)").matches)addEventListener("pointerdown",e=>{const g=["♪","♫","♩","♬"],cs=["var(--gold)","var(--terra)","var(--caramel)"];
 for(let k=0;k<7;k++){const n=document.createElement("span");n.className="tapnote";n.textContent=g[k%4];
  n.style.cssText=`left:${e.clientX}px;top:${e.clientY}px;--s:${22+Math.random()*26}px;--c:${cs[k%3]};--dx:${(Math.random()-.5)*170}px;--dy:${-(80+Math.random()*130)}px;--r:${(Math.random()-.5)*50}deg;--dl:${k*40}ms`;
  n.setAttribute("aria-hidden","true");document.body.appendChild(n);n.addEventListener("animationend",()=>n.remove())}});
render();
/* share sheet + gentle pointer tilt on the floating card */
(function(){const b=document.body,sh=$("#sheet");let prev=null;
 const open=()=>{prev=document.activeElement;b.classList.add("sharing");sh.setAttribute("aria-hidden","false");$("#lnk").value=url;setTimeout(()=>$("#cp").focus(),80)};
 const close=()=>{b.classList.remove("sharing");sh.setAttribute("aria-hidden","true");prev&&prev.focus()};
 [$("#open"),$("#fab")].forEach(e=>e&&e.addEventListener("click",open));$("#scrim").onclick=close;$("#x").onclick=close;
 addEventListener("keydown",e=>{if(e.key==="Escape"&&b.classList.contains("sharing"))close()});
 $("#lnk").addEventListener("focus",e=>e.target.select());
 const cv=$("#app");
 if(cv&&matchMedia("(pointer:fine) and (prefers-reduced-motion:no-preference)").matches){
  cv.addEventListener("pointermove",e=>{const r=cv.getBoundingClientRect();cv.style.setProperty("--ry",((e.clientX-r.left)/r.width-.5)*1.6+"deg");cv.style.setProperty("--rx",-((e.clientY-r.top)/r.height-.5)*1.2+"deg")});
  cv.addEventListener("pointerleave",()=>{cv.style.setProperty("--ry","0deg");cv.style.setProperty("--rx","0deg")})}})();
requestAnimationFrame(()=>requestAnimationFrame(()=>{document.body.classList.remove("pre");document.body.classList.add("go")}));
</script>
